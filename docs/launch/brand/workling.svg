<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" role="img" aria-label="A Workling: a small round green creature in a yellow hard hat, waving and holding a mug">
  <title>Workling</title>
  <defs>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9AD48C"/>
      <stop offset="0.55" stop-color="#76B56C"/>
      <stop offset="1" stop-color="#5E9A5A"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE36A"/>
      <stop offset="1" stop-color="#E8C531"/>
    </linearGradient>
  </defs>
  <g stroke="#1F3A2E" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- feet -->
    <ellipse cx="100" cy="226" rx="20" ry="12" fill="#4E7A47"/>
    <ellipse cx="156" cy="226" rx="20" ry="12" fill="#4E7A47"/>
    <!-- waving arm -->
    <path d="M58 150 Q38 136 30 112" fill="none" stroke-width="27"/>
    <path d="M58 150 Q38 136 30 112" fill="none" stroke="#76B56C" stroke-width="15"/>
    <circle cx="29" cy="102" r="15" fill="#86C27A"/>
    <!-- body -->
    <path d="M128 62 C190 62 214 110 213 158 C212 206 176 228 128 228 C80 228 44 206 43 158 C42 110 66 62 128 62 Z" fill="url(#body)"/>
    <!-- belly -->
    <ellipse cx="128" cy="190" rx="42" ry="26" fill="#D8EFC8" stroke="none"/>
    <!-- mug and the hand that holds it -->
    <path d="M222 178 h6 a10 10 0 0 1 0 20 h-6" fill="none" stroke-width="10"/>
    <rect x="190" y="168" width="34" height="38" rx="8" fill="#FCFBF7"/>
    <rect x="196" y="176" width="22" height="7" rx="3.5" fill="#F2D541" stroke="none"/>
    <circle cx="192" cy="190" r="12" fill="#76B56C"/>
    <!-- hard hat -->
    <path d="M86 70 C86 22 170 22 170 70 Z" fill="url(#hat)"/>
    <path d="M128 32 V66" fill="none" stroke="#D9B32A" stroke-width="7"/>
    <rect x="72" y="62" width="112" height="16" rx="8" fill="url(#hat)"/>
  </g>
  <!-- face -->
  <ellipse cx="103" cy="122" rx="18" ry="22" fill="#1F2A24"/>
  <ellipse cx="153" cy="122" rx="18" ry="22" fill="#1F2A24"/>
  <circle cx="96" cy="112" r="7.5" fill="#FFFFFF"/>
  <circle cx="146" cy="112" r="7.5" fill="#FFFFFF"/>
  <circle cx="109" cy="131" r="3.5" fill="#FFFFFF"/>
  <circle cx="159" cy="131" r="3.5" fill="#FFFFFF"/>
  <ellipse cx="79" cy="150" rx="15" ry="9" fill="#F4978E" opacity="0.85"/>
  <ellipse cx="177" cy="150" rx="15" ry="9" fill="#F4978E" opacity="0.85"/>
  <path d="M114 150 Q128 164 142 150" fill="none" stroke="#1F2A24" stroke-width="6" stroke-linecap="round"/>
</svg>
